[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vyas"
version = "0.1.0"
description = "Voice-verified mantra japa counting, as a mountable FastAPI module"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[tool.setuptools]
packages = ["vyas"]
