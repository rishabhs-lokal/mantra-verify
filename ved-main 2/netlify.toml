[build]
  command = "npm run build"
  publish = "dist"

# Fill in the real Render URL once the backend is deployed (step 1).
# Vite's dev-only "/api" proxy (vite.config.ts) doesn't exist in the built
# static site — this redirect is what plays that role in production.
[[redirects]]
  from = "/api/*"
  to = "https://ved-backend.onrender.com/api/:splat"
  status = 200
  force = true
