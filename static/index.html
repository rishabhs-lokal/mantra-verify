<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vyas — Mantra Sadhana Companion</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="app-header">
  <h1>Vyas</h1>
  <p class="subtitle">Your mantra sadhana companion</p>
</header>

<main class="layout">

  <section class="vyas-panel">
    <div class="vyas-figure" id="vyas-figure">
      <svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vyas, a seated sage beneath a banyan tree">
        <defs>
          <radialGradient id="auraGradient" cx="50%" cy="34%" r="50%">
            <stop offset="0%" stop-color="#ffe3ad" stop-opacity="0.95"/>
            <stop offset="55%" stop-color="#ffb347" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f6d9a8"/>
            <stop offset="100%" stop-color="#fbf3e7"/>
          </linearGradient>
          <linearGradient id="robeGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ea7233"/>
            <stop offset="100%" stop-color="#b9451c"/>
          </linearGradient>
          <linearGradient id="legGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d95f28"/>
            <stop offset="100%" stop-color="#9c3f18"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="480" height="640" fill="url(#skyGradient)"/>

        <!-- banyan canopy -->
        <g fill="#6b5b3c" opacity="0.55">
          <ellipse cx="120" cy="55" rx="110" ry="46"/>
          <ellipse cx="240" cy="35" rx="130" ry="50"/>
          <ellipse cx="365" cy="55" rx="110" ry="46"/>
        </g>

        <!-- aerial roots, behind the figure -->
        <g stroke="#6b4a2f" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round">
          <path d="M40 40 C 60 160, 20 300, 55 460 C 65 520, 50 580, 60 630"/>
          <path d="M95 30 C 115 170, 75 320, 105 480"/>
          <path d="M150 20 C 165 150, 140 280, 160 420"/>
          <path d="M440 40 C 420 160, 460 300, 425 460 C 415 520, 430 580, 420 630"/>
          <path d="M385 30 C 365 170, 405 320, 375 480"/>
          <path d="M330 20 C 315 150, 340 280, 320 420"/>
        </g>

        <g id="auraGroup">
          <circle cx="240" cy="220" r="190" fill="url(#auraGradient)"/>
        </g>

        <!-- rug -->
        <ellipse cx="240" cy="592" rx="205" ry="34" fill="#c96a2c"/>
        <ellipse cx="240" cy="592" rx="205" ry="34" fill="none" stroke="#f0dab0" stroke-width="3" stroke-dasharray="10 8"/>
        <ellipse cx="240" cy="588" rx="172" ry="24" fill="#f0dab0"/>

        <!-- seat cushion -->
        <rect x="120" y="548" width="240" height="42" rx="21" fill="#6b4423"/>

        <!-- small props: stones, pot, book, bird -->
        <g fill="#9a978f">
          <ellipse cx="95" cy="612" rx="16" ry="10"/>
          <ellipse cx="122" cy="618" rx="12" ry="8"/>
          <ellipse cx="70" cy="620" rx="10" ry="7"/>
        </g>
        <g>
          <rect x="70" y="580" width="46" height="10" rx="2" fill="#e9dcc0" stroke="#c9b992" stroke-width="1"/>
          <rect x="72" y="576" width="42" height="6" rx="2" fill="#f4ecd8" stroke="#c9b992" stroke-width="1"/>
        </g>
        <g>
          <ellipse cx="400" cy="598" rx="18" ry="8" fill="#8a6a2a"/>
          <path d="M386 598 C 386 578, 414 578, 414 598 Z" fill="#a3822f"/>
          <ellipse cx="400" cy="578" rx="10" ry="4" fill="#c9a54a"/>
        </g>
        <g fill="#f4f1ea" stroke="#cfc8b8" stroke-width="1">
          <path d="M415 190 C 430 182, 448 184, 458 176 C 448 190, 434 196, 415 198 Z"/>
          <path d="M415 198 C 428 200, 442 208, 448 218 C 434 214, 422 210, 415 206 Z"/>
        </g>

        <!-- crossed-leg seated base -->
        <path d="M150 470 C 110 495, 90 540, 105 575 L 145 588 C 190 598, 290 598, 335 588 L 375 575 C 390 540, 370 495, 330 470 C 300 450, 180 450, 150 470 Z" fill="url(#legGradient)"/>
        <path d="M120 520 C 150 535, 180 540, 200 538" stroke="#7a3312" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path d="M360 520 C 330 535, 300 540, 280 538" stroke="#7a3312" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>

        <!-- torso robe -->
        <path d="M195 330 C 170 380, 160 440, 172 475 L 308 475 C 320 440, 310 380, 285 330 C 260 300, 220 300, 195 330 Z" fill="url(#robeGradient)"/>
        <path d="M205 340 C 230 355, 250 355, 275 340" stroke="#9c3f18" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path d="M195 400 C 225 415, 255 415, 285 400" stroke="#9c3f18" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>

        <!-- resting hand on knee -->
        <ellipse cx="325" cy="470" rx="20" ry="15" fill="#c97b4a"/>
        <ellipse cx="325" cy="470" rx="20" ry="15" fill="none" stroke="#a8623a" stroke-width="1.5" opacity="0.6"/>

        <!-- raised hand in teaching mudra -->
        <path d="M190 340 C 150 320, 125 280, 120 235" stroke="#d98a56" stroke-width="18" fill="none" stroke-linecap="round"/>
        <circle cx="117" cy="222" r="16" fill="#d98a56"/>
        <circle cx="108" cy="210" r="6" fill="none" stroke="#a8623a" stroke-width="2.5"/>

        <!-- mala beads -->
        <g fill="#3d2712">
          <circle cx="210" cy="352" r="7"/>
          <circle cx="222" cy="365" r="7"/>
          <circle cx="238" cy="373" r="7"/>
          <circle cx="256" cy="373" r="7"/>
          <circle cx="272" cy="365" r="7"/>
          <circle cx="284" cy="352" r="7"/>
        </g>

        <g id="headGroup">
          <!-- beard -->
          <path d="M188 260 C 172 320, 178 390, 240 405 C 302 390, 308 320, 292 260 C 285 320, 195 320, 188 260 Z" fill="#f4f1ea"/>
          <g stroke="#dcd4c2" stroke-width="2" opacity="0.7" fill="none">
            <path d="M205 280 C 200 320, 208 360, 225 385"/>
            <path d="M240 285 C 238 330, 240 370, 240 398"/>
            <path d="M275 280 C 280 320, 272 360, 255 385"/>
          </g>

          <!-- hair sides -->
          <path d="M178 210 C 150 260, 148 330, 172 385 C 158 320, 165 250, 182 205 Z" fill="#f4f1ea"/>
          <path d="M302 210 C 330 260, 332 330, 308 385 C 322 320, 315 250, 298 205 Z" fill="#f4f1ea"/>

          <!-- neck -->
          <rect x="222" y="245" width="36" height="30" fill="#c97b4a"/>

          <!-- head -->
          <ellipse cx="240" cy="205" rx="58" ry="62" fill="#d0895a"/>

          <!-- hair top -->
          <path d="M182 195 C 178 150, 210 118, 240 118 C 270 118, 302 150, 298 195 C 290 150, 260 135, 240 135 C 220 135, 190 150, 182 195 Z" fill="#f4f1ea"/>

          <!-- ears -->
          <ellipse cx="180" cy="212" rx="9" ry="14" fill="#c97b4a"/>
          <ellipse cx="300" cy="212" rx="9" ry="14" fill="#c97b4a"/>

          <!-- tripundra + bindi -->
          <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
            <path d="M205 172 C 216 166, 226 166, 236 172"/>
            <path d="M212 182 C 222 176, 230 176, 238 182"/>
          </g>
          <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
            <path d="M244 172 C 254 166, 264 166, 275 172"/>
            <path d="M242 182 C 250 176, 258 176, 268 182"/>
          </g>
          <circle cx="240" cy="188" r="5" fill="#b5241f"/>

          <!-- eyebrows -->
          <path d="M203 198 C 212 192, 224 192, 232 198" stroke="#5c4a38" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M248 198 C 256 192, 268 192, 277 198" stroke="#5c4a38" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- eyes, with visible iris for warmth/sanctity -->
          <path d="M205 210 C 213 204, 225 204, 233 210 C 225 216, 213 216, 205 210 Z" fill="#fffaf0"/>
          <circle cx="219" cy="210" r="5.5" fill="#4a2e1a"/>
          <circle cx="221" cy="208" r="1.6" fill="#fff"/>

          <path d="M247 210 C 255 204, 267 204, 275 210 C 267 216, 255 216, 247 210 Z" fill="#fffaf0"/>
          <circle cx="261" cy="210" r="5.5" fill="#4a2e1a"/>
          <circle cx="263" cy="208" r="1.6" fill="#fff"/>

          <!-- nose -->
          <path d="M238 214 C 236 224, 234 232, 240 236" stroke="#a8623a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

          <!-- gentle smile -->
          <path d="M222 244 Q 240 254, 258 244" stroke="#8a5a38" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <p class="vyas-status" id="vyas-status">Vyas is listening.</p>
  </section>

  <section class="side-panels">

    <section class="panel practice-panel">
      <h2>Recite</h2>

      <label>Language
        <select id="language-select">
          <option value="hi">Hindi</option>
          <option value="en">English</option>
          <option value="sa">Sanskrit</option>
          <option value="bn">Bengali</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="mr">Marathi</option>
          <option value="gu">Gujarati</option>
          <option value="kn">Kannada</option>
          <option value="ml">Malayalam</option>
          <option value="pa">Punjabi</option>
          <option value="ur">Urdu</option>
          <option value="ne">Nepali</option>
          <option value="as">Assamese</option>
          <option value="sd">Sindhi</option>
        </select>
      </label>

      <label>Mantra (reference text)
        <textarea id="reference-text" rows="2">ॐ नमः शिवाय</textarea>
      </label>

      <div class="row">
        <label>Mantra ID
          <input id="mantra-id" type="text" value="om-namah-shivaya" />
        </label>
        <label>Target count
          <input id="target-count" type="number" value="108" min="1" />
        </label>
      </div>

      <div class="record-row">
        <button id="record-btn" class="btn btn-primary">Start Recording</button>
        <span id="record-indicator" class="record-indicator" hidden>● recording…</span>
      </div>

      <div id="verify-error" class="error" hidden></div>

      <div id="verify-result" class="verify-result" hidden>
        <div class="score-row">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="score-value" id="result-score">–</span>
          </div>
          <div class="score-box">
            <span class="score-label">Completion</span>
            <span class="score-value" id="result-completion">–</span>
          </div>
          <div class="score-box">
            <span class="score-label" id="result-passed-label">Result</span>
            <span class="score-value" id="result-passed">–</span>
          </div>
        </div>

        <div class="progress-row">
          <span id="result-count">0</span> / <span id="result-target">108</span> repetitions
          <span id="result-mala-complete" class="mala-badge" hidden>🕉 Mala complete</span>
        </div>

        <p class="transcript-label">You said:</p>
        <p id="result-transcript" class="transcript"></p>

        <p class="transcript-label">Word by word:</p>
        <p id="result-word-diff" class="word-diff"></p>
      </div>
    </section>

    <section class="panel chat-panel">
      <h2>Talk to Vyas</h2>
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-error" class="error" hidden></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ask Vyas something…" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </section>

  </section>
</main>

<audio id="vyas-audio" hidden></audio>

<script src="/app.js"></script>
</body>
</html>
