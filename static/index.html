<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vyas — Mantra Sadhana Companion</title>
<link rel="stylesheet" href="/style.css?v=8" />
</head>
<body>
<header class="app-header">
  <h1>Vyas</h1>
</header>

<main class="layout-simple">

  <section class="vyas-panel">
    <div class="vyas-figure" id="vyas-figure">
      <img src="/vyas-portrait.png" alt="Vyas, a seated sage beneath a banyan tree" />
      <video id="vyas-chant-video" playsinline hidden></video>
    </div>
    <p class="vyas-status" id="vyas-status">Vyas is listening.</p>
  </section>

  <section class="panel counter-card">
    <div class="mode-toggle">
      <button type="button" id="mode-user-btn" class="mode-btn active">You Chant</button>
      <button type="button" id="mode-vyas-btn" class="mode-btn">Vyas Chants</button>
    </div>

    <label>Number of chants (1–12)
      <input id="target-count" type="number" value="12" min="1" max="12" />
    </label>

    <div class="record-row">
      <button id="session-start-btn" class="btn btn-primary">Start</button>
      <button id="session-stop-btn" class="btn btn-secondary" hidden>Stop</button>
      <button id="session-resume-btn" class="btn btn-primary" hidden>Resume</button>
    </div>

    <div id="session-counter-wrap" class="session-counter-wrap" hidden>
      <div class="session-counter" id="session-counter">–</div>
      <p class="session-counter-label">chants remaining</p>
    </div>

    <p id="session-status" class="session-status"></p>
    <div id="session-error" class="error" hidden></div>
  </section>

</main>

<audio id="vyas-audio" hidden></audio>

<script src="/app.js?v=8"></script>
</body>
</html>
