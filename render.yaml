services:
  - type: web
    name: ved-backend
    runtime: python
    rootDir: ved-main 2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SHEETS_WEBAPP_URL
        sync: false
      - key: SHEETS_SHARED_SECRET
        sync: false

  - type: web
    name: ved-frontend
    runtime: static
    rootDir: ved-main 2
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Vite's dev-only "/api" proxy doesn't exist in the static build —
      # this plays that role in production, forwarding to ved-backend.
      # If Render assigns a different backend URL than this (e.g. the
      # ved-backend name was taken), update the destination to match.
      - type: rewrite
        source: /api/*
        destination: https://ved-backend.onrender.com/api/*
